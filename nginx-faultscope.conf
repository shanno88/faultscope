# FaultScope — faultscope.cn
# Static site served by nginx. Certbot will add the SSL (443) server block
# when you run:
#   sudo certbot --nginx -d faultscope.cn -d www.faultscope.cn
server {
    listen 80;
    server_name faultscope.cn www.faultscope.cn;

    root /var/www/faultscope;
    index index.html;

    # English landing page at /
    location = / {
        try_files /index.html =404;
    }

    # Chinese landing page at /zh
    location = /zh {
        try_files /zh.html =404;
    }

    # Terms / Refund / Privacy and any other static file
    location / {
        try_files $uri $uri/ =404;
    }

    access_log /var/log/nginx/faultscope.access.log;
    error_log /var/log/nginx/faultscope.error.log;
}
